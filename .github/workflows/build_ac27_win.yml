name: Build Add-On AC27 Win

on:
  push:
    branches: [ '**' ]
    paths: [ 'archicad-addon/**', '.github/workflows/build_ac27_win.yml' ]
  workflow_dispatch:

jobs:
  build_win:
    runs-on: [ windows-2022 ]
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
    - name: Download Development Kit
      run: python archicad-addon/Tools/download_and_unzip.py https://github.com/GRAPHISOFT/archicad-api-devkit/releases/download/27.3001/API.Development.Kit.WIN.27.3001.zip archicad-addon/Build/DevKits/AC27
    - name: Generate Project
      run: cmake -B archicad-addon/Build -G "Visual Studio 17 2022" -A "x64" -T "v142" -DAC_VERSION=27 -DAC_API_DEVKIT_DIR="archicad-addon/Build/DevKits/AC27/Support" archicad-addon
    - name: Build RelWithDebInfo
      run: cmake --build archicad-addon/Build --config RelWithDebInfo
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DeslabTapir AddOn AC27 Win
        path: archicad-addon/Build/RelWithDebInfo/TapirAddOn_AC27_Win.apx
