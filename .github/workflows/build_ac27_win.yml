name: Build Add-On AC27 Win

on:
  push:
    branches: [ '**' ]
    paths: [ 'archicad-addon/**', '.github/workflows/build_ac27_win.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_win:
    runs-on: [ windows-2022 ]
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
    - name: Download Development Kit
      run: python archicad-addon/Tools/download_and_unzip.py https://github.com/GRAPHISOFT/archicad-api-devkit/releases/download/27.3001/API.Development.Kit.WIN.27.3001.zip archicad-addon/Build/DevKits/AC27
    - name: Generate Project
      run: cmake -B archicad-addon/Build -G "Visual Studio 17 2022" -A "x64" -T "v142" -DAC_VERSION=27 -DAC_API_DEVKIT_DIR="archicad-addon/Build/DevKits/AC27/Support" archicad-addon
    - name: Build RelWithDebInfo
      run: cmake --build archicad-addon/Build --config RelWithDebInfo
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DeslabTapir AddOn AC27 Win
        path: archicad-addon/Build/RelWithDebInfo/TapirAddOn_AC27_Win.apx
    - name: Publish to the "ac27-latest" release (main only)
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        gh release view ac27-latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create ac27-latest -R "$GITHUB_REPOSITORY" --prerelease --title "AC27 Win, latest main build" --notes "Built from main by build_ac27_win.yml."
        gh release upload ac27-latest -R "$GITHUB_REPOSITORY" --clobber archicad-addon/Build/RelWithDebInfo/TapirAddOn_AC27_Win.apx
