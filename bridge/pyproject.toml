[project]
name = "deslab-bridge"
version = "0.1.0"
description = "deslab bridge: Claude to Archicad through the deslab add-on, office rules in code"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2"]

[project.optional-dependencies]
# deslab: PDF pages to PNG and images for the AI review (deslab_bridge.ai)
ai = ["pymupdf", "pillow"]

[project.scripts]
deslab-mcp = "deslab_bridge.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deslab_bridge"]

[tool.hatch.build.targets.wheel.force-include]
"office-profile.json" = "office-profile.json"
